services:
  postgres:
    image: postgres:16
    container_name: evrcar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: evrcar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - evrcar_data:/var/lib/postgresql/data
volumes:
  evrcar_data:
