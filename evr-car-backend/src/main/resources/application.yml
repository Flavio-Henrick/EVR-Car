server:
  port: ${PORT:8080}
spring:
  application:
    name: evr-car-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/evrcar}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
app:
  jwt:
    # Troque por uma chave aleatória de pelo menos 32 caracteres antes de publicar.
    secret: ${JWT_SECRET:CHANGE_THIS_SECRET_TO_A_RANDOM_VALUE_AT_LEAST_32_CHARS}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:720}
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}
cloudinary:
  cloud-name: ${CLOUDINARY_CLOUD_NAME:}
  api-key: ${CLOUDINARY_API_KEY:}
  api-secret: ${CLOUDINARY_API_SECRET:}
